<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard Popup</title>

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        /* Open Button */
        .open-btn {
            padding: 12px 25px;
            background: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        .open-btn:hover {
            background: #084298;
        }

        /* Overlay */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1000;
        }

        /* Popup Dashboard */
        .dashboard {
            background: #ffffff;
            width: 700px;
            max-width: 95%;
            margin: 80px auto;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .dashboard-header {
            background: rgba(255, 121, 21, 1);
            color: #fff;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            font-size: 22px;
            cursor: pointer;
        }

        .dashboard-body {
            padding: 20px;
        }

        /* Table Styling */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #f1f4f9;
            color: #333;
            font-weight: 600;
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 10px;
            border: 1px solid #ddd;
            color: #222;
            white-space: nowrap;
        }

        tr:hover {
            background: #f9fbff;
        }

        .amount {
            color: #198754;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<button class="open-btn" onclick="openDashboard()">View Dashboard</button>

<div class="overlay" id="overlay">
    <div class="dashboard">
        <div class="dashboard-header">
            Customer Dashboard
            <span class="close-btn" onclick="closeDashboard()">&times;</span>
        </div>

        <div class="dashboard-body">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>User id</th>
                            <th>User Name</th>
                            <th>User Role</th>
                            <th>Alert Status</th>
                            <th>Ticket Count</th>
                            <th>Alert Count</th>
                            <th>Ticket Count</th>
                            <th>Action Count</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>ID_10245</td>
                            <td>Debarjit Mohanty</td>
                            <td>Analyst</td>
                            <td class="amount">20</td>
                            <td>30</td>
                            <td>40</td>
                            <td>50</td>

                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function openDashboard() {
        document.getElementById("overlay").style.display = "block";
    }

    function closeDashboard() {
        document.getElementById("overlay").style.display = "none";
    }
</script>

</body>
</html>
